[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mma3001-plate-cooling"
version = "1.0.0"
description = "Verified explicit and implicit finite-difference study of idealised plate cooling"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-html>=4", "pdoc>=15"]
report = ["reportlab>=4", "pypdf>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
